plugins {
    id 'com.android.application'
}

android {
    namespace 'io.bhydra.wallet'
    compileSdk 34

    defaultConfig {
        applicationId "io.bhydra.wallet"
        minSdk 24            // Android 7: WebView с современным движком
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // Для публикации нужна своя подпись: см. android/README.md.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
